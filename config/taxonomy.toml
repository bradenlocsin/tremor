lon = [117.0, 123.0]
first_slice = false

[[regions]]
id = "black_sea"
name = "Black Sea"
lat = [40.5, 47.5]
lon = [27.0, 42.0]
first_slice = false

[[regions]]
id = "levant"
name = "Eastern Mediterranean / Levant"
