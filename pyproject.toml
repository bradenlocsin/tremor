[project]
name = "tremor"
version = "0.1.0"
description = "Tracking Risk Events & Market Outcome Reactions: geopolitical event studies for markets."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "statsmodels>=0.14",
    "scipy>=1.11",
    "yfinance>=0.2.40",
    "matplotlib>=3.8",
    "anthropic>=2.10.0",
    "pydantic>=2.14.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
tremor = "tremor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tremor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access (deselect with -m 'not network')"]

[tool.ruff]
line-length = 100
